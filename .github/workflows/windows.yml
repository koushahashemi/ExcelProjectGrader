name: Windows grader
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: cmd
        run: call "Build Windows EXE.bat"
      - shell: pwsh
        run: |
          .venv/Scripts/python.exe -c "from openpyxl import Workbook; Workbook().save('smoke.xlsx')"
          Start-Process -FilePath "dist/ExcelProjectGrader.exe" -ArgumentList "--json smoke.json smoke.xlsx" -Wait
          if ((Get-Content smoke.json -Raw | ConvertFrom-Json).submissions[0].status -ne 'Error') { throw 'Packaged grader did not generate evidence' }
      - uses: actions/upload-artifact@v4
        with:
          name: ExcelProjectGrader-Windows
          path: |
            dist/ExcelProjectGrader.exe
            Install and Run.bat
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ExcelProjectGrader-Windows
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "dist/ExcelProjectGrader.exe" "Install and Run.bat" --repo "$env:GITHUB_REPOSITORY" --title "Excel Project Grader $env:GITHUB_REF_NAME" --generate-notes
