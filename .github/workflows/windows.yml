name: Windows grader
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: |
          cmd /c 'call "Build Windows EXE.bat"' *> "$env:RUNNER_TEMP/windows-build.log"
          $buildExit = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/windows-build.log"
          if ($buildExit -ne 0) {
            $tail = (Get-Content "$env:RUNNER_TEMP/windows-build.log" -Tail 22) -join '%0A'
            Write-Output "::error::$tail"
            exit $buildExit
          }
      - shell: pwsh
        run: |
          .venv/Scripts/python.exe -c "from openpyxl import Workbook; Workbook().save('smoke.xlsx')"
          Start-Process -FilePath "dist/ExcelProjectGrader.exe" -ArgumentList "--json smoke.json smoke.xlsx" -Wait
          $report = ConvertFrom-Json -InputObject (Get-Content smoke.json -Raw) -NoEnumerate
          if ($report[0].status -ne 'Error') { throw 'Packaged grader did not generate evidence' }
      - uses: actions/upload-artifact@v4
        with:
          name: ExcelProjectGrader-Windows
          path: |
            dist/ExcelProjectGrader.exe
            Install and Run.bat
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-v1.1.0]'))
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ExcelProjectGrader-Windows
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -eq 'main') {
            $tag = 'v1.1.0'
            gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" *> $null
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          gh release create "$tag" "dist/ExcelProjectGrader.exe" "Install and Run.bat" --verify-tag --repo "$env:GITHUB_REPOSITORY" --title "Excel Project Grader $tag" --generate-notes
